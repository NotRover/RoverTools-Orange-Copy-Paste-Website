# Cloudflare Pages config. The site is fully static, so Pages only needs to know
# where the build lands - there are no Functions, bindings or runtime.
#
# The name is the pages.dev hostname, so it is also the public preview URL:
# orange-copy-paste-app.pages.dev. Renaming it renames that.
#
# Settings that are not expressible here:
#   Build command:            bun run build
#   Build output directory:   dist
name = "orange-copy-paste-app"
compatibility_date = "2026-08-21"
pages_build_output_dir = "./dist"
